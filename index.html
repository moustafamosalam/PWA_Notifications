<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#0f172a">
<title>تجربة الإشعارات</title>
<style>body{font-family:system-ui,sans-serif;background:#0f172a;color:#f8fafc;padding:16px;max-width:520px;margin:auto}
section{background:#1e293b;border-radius:12px;padding:12px;margin:12px 0}
button,input{font-size:1.05rem;padding:10px;border-radius:8px;border:0;margin:4px}
button{background:#38bdf8;color:#0f172a}pre{white-space:pre-wrap;font-size:.9rem}</style></head><body>
<h1>🔔 تجربة الإشعارات</h1>
<section><div id="state"></div><button id="perm">1) فعّل الإشعارات</button></section>
<section><h3>بعد كام ثانية</h3><input id="sec" type="number" value="60" min="5"><button id="go">جدولة</button>
<button id="now">إشعار فوري</button></section>
<section><h3>في وقت محدد النهارده</h3><input id="at" type="time"><button id="goat">جدولة</button></section>
<section><h3>السجل</h3><pre id="log"></pre></section>
<script src="app.js"></script></body></html>
