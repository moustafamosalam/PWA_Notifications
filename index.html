<html lang="ar" dir="rtl">

<style>
/* Fonts: Amiri (display) and Tajawal (text), both SIL OFL, served from /fonts. See fonts/FONTS-LICENSE.txt */

@font-face{font-family:'Amiri';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/amiri-700-latin.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
@font-face{font-family:'Tajawal';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/tajawal-400-arabic.woff2) format('woff2');unicode-range:U+0600-06FF, U+0750-077F, U+0870-0891, U+0897-08E1, U+08E3-08FF, U+200C-200E, U+2010-2011, U+204F, U+2E41, U+FB50-FDFF, U+FE70-FE74, U+FE76-FEFC}

@font-face{font-family:'Tajawal';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/tajawal-700-latin.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}

:root{
  --bg:#F3EBDD; --card:#FBF6EC; --ink:#2B1F17; --muted:#6E5D50; --rule:#D9CDB8;
  --rust:#B5472A; --rust-soft:#F3D9CD; --rust-shadow:#E4C3B4; --green:#4F6B3A; --skip:#BDB09A;
  --display:'Amiri',serif; --text:'Tajawal',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--text);font-size:16px;line-height:1.4;
     -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button,input,textarea,select{font-family:inherit;color:inherit}
.app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:0 24px calc(96px + env(safe-area-inset-bottom))}
.hidden{display:none!important}

/* page header: small line, big Amiri title, optional rotated circle */
.ph{padding:calc(env(safe-area-inset-top) + 24px) 0 0;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.ph .small{font-size:14px;font-weight:500;color:var(--muted)}
.ph h1{margin:0;font-family:var(--display);font-size:52px;font-weight:700;line-height:1.15}
.badge{margin-top:8px;flex:none;width:70px;height:70px;border-radius:50%;border:2px solid var(--rust);background:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--rust);transform:rotate(-8deg);padding:0;cursor:pointer}
.badge.static{cursor:default}
.badge.done{border-color:var(--green);color:var(--green)}
.badge .n{font-family:var(--display);font-size:30px;font-weight:700;line-height:1}
.badge .l{font-size:12px;font-weight:700}

/* section header: Amiri title, hairline, count */
.sec{display:flex;align-items:center;gap:12px;height:32px;margin-top:6px}
.sec:first-child{margin-top:0}
.sec h2{margin:0;font-family:var(--display);font-size:21px;font-weight:700}
.sec .line{flex:1;height:1px;background:var(--rule)}
.sec .cnt{font-size:13px;font-weight:500;color:var(--muted)}
.list{margin-top:8px;display:flex;flex-direction:column;gap:4px}

/* rows */
.row{display:flex;align-items:center;gap:14px;min-height:52px;width:100%;padding:0;background:none;border:0;border-bottom:1px dashed var(--rule);
  text-align:start;cursor:pointer}
.row .mid{flex:1;min-width:0;display:flex;flex-direction:column}
.row .nm{font-size:17px;font-weight:700;line-height:1.55;padding-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub b{font-weight:700}
.row .tm{font-size:15px;font-weight:700;white-space:nowrap}
.row.done .tm{color:var(--muted)}
.ok{color:var(--green)}

/* next-med card */
.next{display:flex;flex-direction:column;gap:10px;margin:8px 0 2px;padding:14px 16px;border-radius:10px;background:var(--card);
  border:2px solid var(--rust);box-shadow:4px 4px 0 var(--rust-shadow);width:100%;text-align:start;cursor:pointer}
.next .top{display:flex;align-items:center;justify-content:space-between}
.next .when{font-size:13px;font-weight:700;color:var(--rust)}
.next .tag{padding:1px 10px;border-radius:999px;border:1px solid var(--rust);font-size:12px;font-weight:700;color:var(--rust)}
.next .mid{display:flex;align-items:center;justify-content:space-between;gap:10px}
.next .who{display:flex;align-items:center;gap:12px;min-width:0}
.next .nm{font-family:var(--display);font-size:26px;font-weight:700;line-height:1.35}
.next .sub{font-size:14px;color:var(--muted)}
.next .big{font-family:var(--display);font-size:40px;font-weight:700;line-height:1;white-space:nowrap}
.next .big small{font-size:18px}
.cta{display:flex;align-items:center;justify-content:center;min-height:46px;padding-top:4px;border-radius:8px;background:var(--rust);color:#fff;font-size:17px;font-weight:700}

/* buttons, fields */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:46px;padding:4px 16px 0;border-radius:8px;border:2px solid var(--rust);
  background:var(--rust);color:#fff;font-size:17px;font-weight:700;margin:10px 0 0;cursor:pointer}
.btn.ghost{background:none;color:var(--rust)}
.btn.green{background:var(--green);border-color:var(--green)}
.btn.quiet{background:var(--card);border:1px solid var(--rule);color:var(--ink);font-weight:500}
.btn.danger{background:none;border:1px solid var(--rule);color:var(--rust);font-weight:700}
.btn:active{transform:translate(1px,1px)}
.field{margin-top:12px}
label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:0 0 5px}
input,textarea{width:100%;min-height:46px;padding:12px 12px 8px;border-radius:8px;border:1px solid var(--rule);background:var(--card);font-size:16px}
input:focus,textarea:focus{outline:none;border-color:var(--rust);box-shadow:3px 3px 0 var(--rust-shadow)}
input.ltr{direction:ltr;text-align:left}
.muted{color:var(--muted);font-size:13px;line-height:1.7}
.note-box{margin-top:8px;padding:12px 14px;border:1px dashed var(--rule);border-radius:8px;color:var(--muted);font-size:14px;line-height:1.7}
.empty{margin-top:28px;padding:26px 16px;border:1px dashed var(--rule);border-radius:10px;text-align:center;color:var(--muted);line-height:1.9}
.empty h3{margin:0 0 6px;font-family:var(--display);font-size:24px;color:var(--ink)}
.days{display:flex;flex-wrap:wrap;gap:6px}
.day{min-width:44px;min-height:44px;padding:4px 10px 0;border-radius:8px;border:1px solid var(--rule);background:var(--card);font-size:14px;font-weight:500;color:var(--muted);cursor:pointer}
.day.on{background:var(--rust);border-color:var(--rust);color:#fff;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{min-height:36px;padding:3px 12px 0;border-radius:999px;border:1px solid var(--rule);background:none;font-size:13px;color:var(--muted)}

/* tab bar */
nav{position:fixed;bottom:0;left:0;right:0;z-index:10;background:var(--card);border-top:1px solid var(--rule)}
nav .in{max-width:560px;margin:0 auto;display:flex;padding:8px 8px calc(10px + env(safe-area-inset-bottom))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:48px;background:none;border:0;padding:0;
  color:var(--muted);font-size:12px;font-weight:500;cursor:pointer}
nav button .ic{display:flex;align-items:center;justify-content:center;width:56px;height:30px;border-radius:15px}
nav button.on{color:var(--rust);font-weight:700}
nav button.on .ic{background:var(--rust-soft)}

/* sheets */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(43,31,23,.5);display:flex;align-items:flex-end}
.panel{width:100%;max-width:560px;margin:0 auto;max-height:92vh;overflow:auto;background:var(--card);border-top:2px solid var(--rust);
  border-radius:14px 14px 0 0;padding:0 20px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -6px 0 var(--rust-shadow)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--rule);margin:10px auto 0}
.panel .hd{padding:14px 0 6px}
.panel .hd .small{font-size:13px;font-weight:500;color:var(--muted)}
.panel .hd h3{margin:0;font-family:var(--display);font-size:28px;font-weight:700;line-height:1.25}
.panel .hd .meta{font-size:15px;color:var(--muted)}
.panel .hd .meta b{color:var(--ink)}
.toast{position:fixed;bottom:calc(96px + env(safe-area-inset-bottom));right:50%;transform:translateX(50%);z-index:30;background:var(--ink);color:var(--card);
  padding:11px 16px;border-radius:8px;font-size:14px;font-weight:500;max-width:90vw;box-shadow:3px 3px 0 var(--rust-shadow)}

nav .in{padding:8px 8px max(12px,env(safe-area-inset-bottom))}
body.noscroll{overflow:hidden}
.ph.s h1{font-size:44px}.ph.end{align-items:flex-end}
.addbtn{display:flex;align-items:center;gap:6px;min-height:46px;padding:4px 16px 0;border:0;border-radius:8px;background:var(--rust);color:#fff;font:700 16px var(--text);box-shadow:3px 3px 0 #E4C3B4;margin-bottom:6px}
.mlist{margin-top:10px;border-top:1px solid var(--rule)}
.mrow{display:flex;align-items:center;gap:12px;width:100%;padding:12px 0;background:none;border:0;border-bottom:1px dashed var(--rule);text-align:right;color:var(--ink);font-family:inherit;cursor:pointer}
.mid2{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.l1{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.l1 .nm{font-size:17px;font-weight:700;line-height:1.55;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.l1 .tm{font-size:15px;font-weight:700;color:var(--muted);white-space:nowrap}
.l2{display:flex;align-items:center;justify-content:space-between;gap:8px}
.l2 .nt{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.dc{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;border:1px solid #BDB09A;color:var(--muted);font-size:12px;font-weight:500;padding-top:2px;box-sizing:border-box;flex:none}
.dc.on{background:var(--rust);border-color:var(--rust);color:#fff;font-weight:700}
.hist{margin-top:4px}.hday{margin-top:14px}
.hh{display:flex;align-items:baseline;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:4px}
.hh h2{margin:0;font-family:var(--display);font-size:22px;font-weight:700;line-height:1.3}
.hh span{font-size:13px;font-weight:700}
.hrow{display:flex;align-items:center;gap:12px;min-height:44px;border-bottom:1px dashed var(--rule)}
.hrow .hn{flex:1;font-size:16px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow .ht{font-size:14px;color:var(--muted);white-space:nowrap}
.hrow .hs{width:56px;text-align:left;font-size:13px;font-weight:700;white-space:nowrap}
.hnote{margin-top:8px;font-size:13px;color:var(--muted)}
.setp{padding-bottom:8px}.sg{margin-top:20px}
.sh{display:flex;align-items:center;gap:12px;margin:0 0 8px;font-family:var(--display);font-size:21px;font-weight:700}
.sh .line{flex:1;height:1px;background:var(--rule)}
.box{border-radius:10px;background:var(--card);border:1.5px solid var(--ink);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.box.plain{gap:0}.box.nopad{padding:0;gap:0}
.fl{font-size:14px;font-weight:700;color:var(--muted)}
.sin{min-height:46px;border:1px solid #BDB09A;background:var(--bg);border-radius:8px;padding:2px 12px 0;font:500 14px var(--text);color:var(--ink);direction:ltr;text-align:left;width:100%;box-sizing:border-box}
.srv{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.srv .dot{width:10px;height:10px;border-radius:50%;flex:none}.srv .cron{margin-right:auto}
.trow,.trow2{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px}
.trow2{padding:0}
.tt{font-size:17px;font-weight:700;line-height:1.5}.ts{font-size:13px;color:var(--muted)}
.tog{flex:none;width:54px;height:32px;border-radius:16px;border:1.5px solid var(--ink);background:#E9DDC8;display:flex;justify-content:flex-end;align-items:center;padding:0 3px;cursor:pointer}
.tog .knob{width:24px;height:24px;border-radius:50%;background:#fff;border:1.5px solid var(--ink)}
.tog.on{background:var(--rust);justify-content:flex-start}
.tbtn{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:4px 16px 0;background:none;border:0;border-top:1px dashed var(--rule);color:var(--rust);font:700 16px var(--text);cursor:pointer}
.sumpill{position:relative;display:inline-flex;align-items:center;padding:2px 14px;border-radius:8px;background:#F3D9CD;color:var(--rust);font-family:var(--display);font-size:28px;font-weight:700;line-height:1.3}
.sumpill input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px}
.sbtn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding-top:4px;border-radius:10px;background:#E9DDC8;border:1px solid var(--rule);color:var(--ink);font:700 16px var(--text);cursor:pointer}
.devline{margin-top:18px;font-size:12px;color:var(--muted)}
.sheet{align-items:flex-end}
#sheetBody.panel{background:var(--bg);border-top:2px solid var(--ink);border-radius:20px 20px 0 0;box-shadow:0 -8px 0 #D9CDB8;padding:0 24px calc(34px + env(safe-area-inset-bottom))}
#sheetBody .grab{width:40px;height:4px;background:#BDB09A;margin:10px auto 14px}
.shd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:14px;margin-bottom:16px;border-bottom:1px dashed #BDB09A}
.shd .who{display:flex;align-items:center;gap:12px;min-width:0}
.shd .sm{font-size:13px;color:var(--muted)}
.shd h2{margin:0;font-family:var(--display);font-size:28px;font-weight:700;line-height:1.3}
.shd .when{display:flex;flex-direction:column;align-items:flex-start}
.shd .big{font-family:var(--display);font-size:34px;font-weight:700;line-height:1.1;white-space:nowrap}.shd .big small{font-size:16px}
.acts{display:flex;flex-direction:column;gap:12px}
.act{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding-top:4px;border-radius:10px;font-family:var(--text);font-weight:700;cursor:pointer;border:0}
.act.main{min-height:60px;background:var(--rust);color:#fff;font-size:19px;box-shadow:4px 4px 0 #E4C3B4}
.act.mid{min-height:60px;background:#E9DDC8;border:1px solid var(--rule);color:var(--ink);font-size:18px}
.act.clr{min-height:52px;background:none;border:1.5px dashed var(--rust);color:var(--rust);font-size:16px}
.ta{width:100%;box-sizing:border-box;margin-bottom:14px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--ink);background:var(--card);font:500 13px/1.6 monospace;color:var(--ink);direction:ltr;text-align:left}
#editor{position:fixed;inset:0;z-index:25;background:var(--bg);overflow:auto;-webkit-overflow-scrolling:touch}
#editor{padding:0 max(24px,calc((100% - 512px)/2))}
.eh{display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top) + 12px) 0 0}
.eh h1{margin:0;font-family:var(--display);font-size:34px;font-weight:700;line-height:1.3}
.back{width:44px;height:44px;margin-right:-10px;background:none;border:0;display:flex;align-items:center;justify-content:center}
.ef{margin:18px 0 0;display:flex;flex-direction:column;gap:18px}
.eg label,.eg .dl label{display:block;margin-bottom:6px;font-size:14px;font-weight:700;color:var(--muted)}
.ein{width:100%;box-sizing:border-box;min-height:52px;border-radius:10px;background:var(--card);border:1.5px solid var(--ink);padding:4px 14px 0;font:700 18px var(--text);color:var(--ink)}
.timebox{position:relative;display:flex;align-items:center;justify-content:space-between}
.timebox .tv{font-family:var(--display);font-size:26px;font-weight:700}
.timebox input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px}
.dl{display:flex;align-items:center;justify-content:space-between}
.alld{background:none;border:0;color:var(--rust);font:700 13px var(--text);padding:0 0 6px}
.dchips{display:flex;gap:6px}
.dchip{flex:1;min-width:0;min-height:44px;padding:4px 0 0;border-radius:8px;border:1px solid #BDB09A;background:var(--card);color:var(--muted);font:500 13px var(--text)}
.dchip.on{background:var(--rust);border-color:var(--rust);color:#fff;font-weight:700}
.sugs{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.sug{min-height:36px;padding:3px 14px 0;border-radius:999px;border:1px dashed #BDB09A;background:none;color:var(--muted);font:500 13px var(--text)}
.eb{margin:24px 0 0;padding-bottom:calc(40px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.save{min-height:56px;padding-top:4px;border:0;border-radius:10px;background:var(--rust);color:#fff;font:700 19px var(--text);box-shadow:4px 4px 0 #E4C3B4}
.del{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding-top:4px;border-radius:10px;background:none;border:1.5px dashed var(--rust);color:var(--rust);font:700 16px var(--text)}
</style>
</head>
<body>
<div class="app">
  <section id="tab-today"></section>
  <section id="tab-meds" class="hidden"></section>
  <section id="tab-log" class="hidden"></section>
  <section id="tab-settings" class="hidden"></section>
</div>
